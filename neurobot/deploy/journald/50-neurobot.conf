# neurobot: журнал переживает перезагрузку (причину сбоя можно найти после ребута) и не съедает SD-карту.
# Ставится install.sh в /etc/systemd/journald.conf.d/ (флаг --no-journald — не ставить).
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=1G
RuntimeMaxUse=64M
MaxRetentionSec=14day
RateLimitIntervalSec=30s
RateLimitBurst=10000
