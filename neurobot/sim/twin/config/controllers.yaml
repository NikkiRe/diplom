# ros2_control двойника: имена и умолчания — как у робота (R7a §1.5: /diff_cont, /joint_broad; articubot_one —
# [гипотеза о происхождении]), пределы — наше предложение для L1 (PLAN §13.3), обоснование — README §4.
# twin.launch.py копирует файл в run_dir и подставляет cmd_vel_timeout (0 — hold, худший случай).
controller_manager:
  ros__parameters:
    update_rate: 50                      # Гц [допущение]; у articubot_one 30
    diff_cont:
      type: diff_drive_controller/DiffDriveController
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:
    publish_rate: 50.0                   # /odom — умолчание diff_drive_controller (Foxy и Jazzy)
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.38               # [оценка по фото ±0,03], R7b §2.3
    wheel_radius: 0.036                  # [оценка по фото ±0,0025]
    cmd_vel_timeout: 0.5                 # с; умолчание Foxy (на роботе не подтверждено, Э0). 0: Jazzy — без таймаута
                                         # (hold), Foxy — тормоз в каждом такте (README §2.4)
    publish_limited_velocity: true       # ~/cmd_vel_out — что контроллер реально отдаёт колёсам (для проверок)
    # Флаги has_*: в Foxy (робот) по умолчанию false, и без них пределы ниже не действуют; в Jazzy по умолчанию true
    # (устарели). Для Foxy вместо max_deceleration — min_acceleration (README §2.4).
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 0.5           # м/с: скорость демо (self.speed); 3000 ед. ПИД ≈ 0,5 м/с [гипотеза R7b §5.2]
    linear.x.max_acceleration: 1.0       # м/с²: стенд R7b §3.2 (1–2), разгон ПИД без перерегулирования (§5.2)
    linear.x.max_deceleration: -1.0      # опрокидывание вперёд — при ≈ g·0,15/0,21 ≈ 7 м/с², запас ×7
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.5          # рад/с: «полный оборот» демо при angular.z = 1 (R7b RS7)
    angular.z.max_acceleration: 5.3      # рад/с²: 2a/b при a = 1 м/с², b = 0,38 м (R7b §5.5)
    angular.z.max_deceleration: -5.3
